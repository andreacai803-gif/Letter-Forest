
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Forest</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F3E9D5;
      color: #234D36;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 8px;
    }

    p {
      max-width: 450px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>🌳 Letter Forest</h1>
  <h2>Explore · Learn · Grow</h2>
  <p>
    Welcome to Letter Forest!
    An interactive learning adventure where
    children discover letters and Braille
    through touch, sound and play.
  </p>
  <p>Our forest is growing. Come explore soon!</p>

</html>
